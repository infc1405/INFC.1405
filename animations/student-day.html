<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INFC.1405 | روز دانش‌آموز مبارک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f4f7fb;
    --muted: #a7b3c9;
    --accent: #2dd4bf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(circle at 85% -10%, rgba(45,212,191,.10), transparent 45%),
      linear-gradient(135deg, #1b0f38 0%, #0a1f38 55%, #081527 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Vazirmatn", Tahoma, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  .back {
    position: absolute;
    top: 16px;
    right: 62px;
    z-index: 3;
    color: var(--muted);
    font-size: .9rem;
    text-decoration: none;
  }
  .back:hover { color: var(--accent); }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .stage { position: fixed; inset: 0; }

  /* دفتر خط‌دار: خط‌های افقی و حاشیه‌ی صورتی سمت راست */
  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to left, transparent 52px, rgba(255,110,140,.28) 52px, rgba(255,110,140,.28) 54px, transparent 54px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 35px, rgba(45,212,191,.09) 35px, rgba(45,212,191,.09) 36px);
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .greet {
    position: absolute;
    left: 0;
    right: 0;
    top: 68%;
    text-align: center;
    padding: 0 16px;
    pointer-events: none;
  }
  .greet > * {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .greet.show > * { opacity: 1; transform: none; }
  .greet.show > :nth-child(2) { transition-delay: .35s; }
  .greet.show > :nth-child(3) { transition-delay: .7s; }

  .date {
    font-size: clamp(.95rem, 3.2vw, 1.15rem);
    color: var(--accent);
  }
  .title {
    margin-top: 4px;
    font-size: clamp(1.7rem, 7vw, 3rem);
    font-weight: 800;
    line-height: 1.3;
    text-shadow: 0 0 18px rgba(45,212,191,.55), 0 2px 2px rgba(0,0,0,.5);
  }
  .from {
    margin-top: 8px;
    font-size: clamp(.8rem, 2.8vw, 1rem);
    color: var(--muted);
  }

  button {
    position: absolute;
    bottom: 14px;
    right: 66px;
    z-index: 3;
    background: transparent;
    color: var(--ink);
    border: 1px solid rgba(45,212,191,.22);
    border-radius: 8px;
    padding: 6px 14px;
    font: inherit;
    font-size: .85rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <a class="back" href="../animations.html">→ بازگشت به انیمیشن‌ها</a>

  <div class="stage" id="stage">
    <canvas id="trail" aria-hidden="true"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="greet" id="greet">
      <div class="date">۱۳ آبان</div>
      <div class="title">روز دانش‌آموز مبارک</div>
      <div class="from">با آرزوی موفقیت، از طرف گروه فریلنسری INFC.1405</div>
    </div>
    <button id="replay" type="button">پخش مجدد</button>
  </div>

<script>
(function () {
  var PULSE = 1200;       // ms: the single point breathing alone
  var DURATION = 9500;    // ms: the point drawing cap and book

  var stage = document.getElementById('stage');
  var trail = document.getElementById('trail');
  var fx    = document.getElementById('fx');
  var greet = document.getElementById('greet');
  var tctx = trail.getContext('2d');
  var fctx = fx.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- the drawing: graduation cap + open book ---------- */
  // coordinates are in a -1..1 box around the starting point (0,0)
  var RAW = [
    // cap board (sharp corners)
    { pts: [[-1,-0.55],[0,-0.85],[1,-0.55],[0,-0.25],[-1,-0.55]], smooth: false },
    // cap base
    { pts: [[-0.52,-0.40],[-0.52,-0.12],[-0.35,0],[0,0.06],[0.35,0],[0.52,-0.12],[0.52,-0.40]], smooth: true },
    // tassel
    { pts: [[0.85,-0.60],[0.85,-0.14],[0.80,-0.08],[0.85,0],[0.90,-0.08],[0.85,-0.14]], smooth: true },
    // open book: left and right pages
    { pts: [[0,0.42],[-0.3,0.33],[-0.65,0.33],[-0.95,0.42],[-0.95,0.92],[-0.65,0.84],[-0.3,0.84],[0,0.92],[0,0.42]], smooth: true },
    { pts: [[0,0.42],[0.3,0.33],[0.65,0.33],[0.95,0.42],[0.95,0.92],[0.65,0.84],[0.3,0.84],[0,0.92]], smooth: true },
    // text lines on the pages
    { pts: [[-0.78,0.53],[-0.2,0.51]], smooth: false },
    { pts: [[-0.78,0.64],[-0.2,0.62]], smooth: false },
    { pts: [[-0.78,0.75],[-0.2,0.73]], smooth: false },
    { pts: [[0.2,0.51],[0.78,0.53]], smooth: false },
    { pts: [[0.2,0.62],[0.78,0.64]], smooth: false },
    { pts: [[0.2,0.73],[0.78,0.75]], smooth: false }
  ];

  function chaikin(p, n) {
    for (var k = 0; k < n; k++) {
      var q = [p[0]];
      for (var i = 0; i < p.length - 1; i++) {
        var a = p[i], b = p[i + 1];
        q.push([.75 * a[0] + .25 * b[0], .75 * a[1] + .25 * b[1]],
               [.25 * a[0] + .75 * b[0], .25 * a[1] + .75 * b[1]]);
      }
      q.push(p[p.length - 1]);
      p = q;
    }
    return p;
  }

  var segs = [], L = 0, cur = [0, 0];
  function addSeg(a, b, draw) {
    var len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    var w = draw ? len : Math.max(len * 0.25, 0.05); // moving without drawing is quick
    segs.push({ a: a, b: b, draw: draw, w: w, c: L });
    L += w;
  }
  RAW.forEach(function (s) {
    var pts = s.smooth ? chaikin(s.pts, 2) : s.pts;
    addSeg(cur, pts[0], false);
    for (var i = 1; i < pts.length; i++) addSeg(pts[i - 1], pts[i], true);
    cur = pts[pts.length - 1];
  });

  /* ---------- canvas + helpers ---------- */
  var W, H, cx, cy, S, dpr, start, lastU, raf, particles, lastSpawn;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth;
    H = stage.clientHeight;
    [trail, fx].forEach(function (c) { c.width = W * dpr; c.height = H * dpr; });
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H * 0.36;
    S = Math.min(W * 0.40, H * 0.25);
  }

  function X(x) { return cx + x * S; }
  function Y(y) { return cy + y * S; }
  function hue(p) { return (170 + p * 300) % 360; }
  function lerp(a, b, f) { return a + (b - a) * f; }

  function glow(ctx, x, y, radius, alpha) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
    g.addColorStop(0.3, 'rgba(255,255,255,' + (alpha * 0.4) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function posAt(u) {
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (u < s.c + s.w) {
        var f = s.w ? Math.max(0, (u - s.c) / s.w) : 1;
        return [lerp(s.a[0], s.b[0], f), lerp(s.a[1], s.b[1], f)];
      }
    }
    var l = segs[segs.length - 1];
    return [l.b[0], l.b[1]];
  }

  // paint the part of the path between progress u0 and u1
  function advance(u0, u1) {
    tctx.lineCap = 'round';
    tctx.lineJoin = 'round';
    tctx.lineWidth = Math.max(2.2, S * 0.02);
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (s.c >= u1) break;
      var e = s.c + s.w;
      if (e <= u0 || !s.draw) continue;
      var a = Math.max(u0, s.c), b = Math.min(u1, e);
      var f0 = (a - s.c) / s.w, f1 = (b - s.c) / s.w;
      var h = hue(a / L);
      tctx.strokeStyle = 'hsl(' + h + ',100%,64%)';
      tctx.shadowColor = 'hsl(' + h + ',100%,60%)';
      tctx.shadowBlur = 14;
      tctx.beginPath();
      tctx.moveTo(X(lerp(s.a[0], s.b[0], f0)), Y(lerp(s.a[1], s.b[1], f0)));
      tctx.lineTo(X(lerp(s.a[0], s.b[0], f1)), Y(lerp(s.a[1], s.b[1], f1)));
      tctx.stroke();
    }
    tctx.shadowBlur = 0;
  }

  /* ---------- letters, numbers and symbols floating out ---------- */
  var CHARS = ['آ','ب','پ','ت','A','B','C','۱','۲','۳','+','−','×','÷','π','∑','★'];

  function spawn(now) {
    var ang = Math.random() * Math.PI * 2;
    var v = S * (0.0002 + Math.random() * 0.0006);
    particles.push({
      ch: CHARS[Math.floor(Math.random() * CHARS.length)],
      vx: Math.cos(ang) * v,
      vy: Math.sin(ang) * v,
      born: now,
      life: 2800 + Math.random() * 1800,
      size: S * (0.14 + Math.random() * 0.12),
      hue: (170 + Math.random() * 300) % 360,
      rot: (Math.random() - 0.5) * 0.8
    });
  }

  function burst(now) {
    for (var i = 0; i < 26; i++) spawn(now);
    lastSpawn = now;
  }

  function floatLoop(now) {
    fctx.clearRect(0, 0, W, H);
    if (now - lastSpawn > 450) { spawn(now); lastSpawn = now; }
    particles = particles.filter(function (p) { return now - p.born < p.life; });
    var ox = cx, oy = cy;
    particles.forEach(function (p) {
      var age = now - p.born;
      var x = ox + p.vx * age;
      var y = oy + p.vy * age - S * 0.00004 * age;
      var alpha = Math.min(age / 300, 1) * (1 - age / p.life);
      fctx.save();
      fctx.globalAlpha = Math.max(alpha, 0);
      fctx.translate(x, y);
      fctx.rotate(p.rot);
      fctx.font = '700 ' + p.size + 'px Vazirmatn, Tahoma, sans-serif';
      fctx.textAlign = 'center';
      fctx.textBaseline = 'middle';
      fctx.shadowColor = 'hsl(' + p.hue + ',100%,60%)';
      fctx.shadowBlur = 12;
      fctx.fillStyle = 'hsl(' + p.hue + ',100%,70%)';
      fctx.fillText(p.ch, 0, 0);
      fctx.restore();
    });
    raf = requestAnimationFrame(floatLoop);
  }

  /* ---------- main timeline ---------- */
  function frame(now) {
    var el = now - start;
    fctx.clearRect(0, 0, W, H);

    if (el < PULSE) {
      // one single point, breathing
      var s = 0.5 + 0.5 * Math.sin((el / PULSE) * Math.PI * 3);
      glow(fctx, cx, cy, 10 + 12 * s, 0.9);
      raf = requestAnimationFrame(frame);
      return;
    }

    var t = Math.min((el - PULSE) / DURATION, 1);
    var u = t * L;
    advance(lastU, u);
    lastU = u;
    var p = posAt(u);
    glow(fctx, X(p[0]), Y(p[1]), 16, 1);

    if (t > 0.88 && !greet.classList.contains('show')) greet.classList.add('show');

    if (t < 1) {
      raf = requestAnimationFrame(frame);
    } else {
      burst(now);
      raf = requestAnimationFrame(floatLoop);
    }
  }

  function run() {
    cancelAnimationFrame(raf);
    resize();
    tctx.clearRect(0, 0, W, H);
    fctx.clearRect(0, 0, W, H);
    greet.classList.remove('show');
    particles = [];
    lastU = 0;
    if (reduceMotion) {
      advance(0, L);
      greet.classList.add('show');
      return;
    }
    start = performance.now();
    raf = requestAnimationFrame(frame);
  }

  document.getElementById('replay').addEventListener('click', run);
  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(run, 200); });
  run();
})();
</script>
</body>
</html>
